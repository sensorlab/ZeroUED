num_iterations: 5     # iterations for each config
starting_iteration: 0 # start id of iteration
exp_id: test        # id of current run
logs_dir: logs        # dir for logs
report_interval: 2    # report interval

# dataset specification
dataset:
  name: WiSig # name in [WiSig, LoRa, Drones]
  config:
    file: ManySig.pkl    # file path for WiSig
    k_fold:             # specification for k_fold
      total_devices: 6
      ratio: 6
    selected_receivers: !!python/tuple [0,]
    test_config:
      days: !!python/tuple [0,1,2,3]
      type: validation
    train_config:
      days: !!python/tuple [0,1,2,3]
      type: train

# train and test loaders
train_loader:
  num_workers: 3
  batch_size: 10
  shuffle: true

test_loader:
  num_workers: 3
  batch_size: 10
  shuffle: false

# specifications for metrics computing
evaluation:
  clusters_numbers: !!python/tuple [80,] # for which numbers of clusters calculate metrics

# specifications for approach and trainer parameters
approach:
  name: Deep Clustering
  config:
    clusters_update_interval: 10
    n_clusters: 20
    device: cpu
    num_epochs: 100
  trainer:
    main_optimizer:
      name: Adam
      config:
        lr: 0.0001 # ranges are supported

# specifications for feature_extractor
feature_extractor:
  name: Simple_CNN_1D
  config:
    input_signal_length: 256
    in_channels: 2
    maxplool_strides: 3
    features_size: 20
    #n_classes: 80
