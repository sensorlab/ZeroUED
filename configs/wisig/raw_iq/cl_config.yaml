num_iterations: 5     # iterations for each config
starting_iteration: 0 # start id of iteration
exp_id: CL_KAN_1D        # id of current run
logs_dir: logs        # dir for logs
report_interval: 2    # report interval

# dataset specification
dataset:
  name: WiSig
  config:
    file:  ManySig.pkl
    k_fold: 
      total_devices: 6
      ratio: 6
    selected_receivers: !!python/tuple [0,]
    test_config:
      type: validation
    train_config:
      type: train

# train and test loaders
train_loader:
  num_workers: 3
  batch_size: 128
  shuffle: true

test_loader:
  num_workers: 3
  batch_size: 128
  shuffle: false

# specifications for metrics computing
evaluation:
  clusters_numbers: !!python/tuple [80] # for which numbers of clusters calculate metrics

# specifications for approach and trainer parameters
approach:
  name: Sim_CLR
  
  config:
    device: cuda
    num_epochs: 100
    large_augs: False
    augs_type: static
    clusters_loss: False
    
  trainer:
    mlp_head:
        in_features: 20
        out_features: 20

    augmentations:
      dims: 1
      viewmaker_config:
        in_channels: 2
        singal_length: 256
        prob: 0.5
        noise_std: 0.05
      
    main_optimizer:
      name: Adam
      config:
        lr: 0.0001
    augs_optimizer:
      name: Adam
      config:
        lr: 0.0001

# specifications for feature_extractor
feature_extractor:
  name: KANS_Encoder
  config:
    input_size: 512
    hidden_size: 20

